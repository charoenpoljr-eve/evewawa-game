const v=setInterval(()=>{if(i++<16){$('rh').textContent='🎲 จังหวัด'+rnd(PV);$('rf').textContent=TR[i%5][1];beep(300+i*25,.04,'square',.05)}else{clearInterval(v);$('rh').textContent='ชาตินี้เกิดที่จังหวัด'+FAM.prov;$('rf').textContent=TR[FAM.tier][1];$('rt').innerHTML=`<div class="yk pop"><div class=yh>${ico('coin',26)}<span>เงินติดตัว</span></div><b>${fm(FAM.cash)}</b></div><div class="yk pop"><div class=yh>${ico('house',26)}<span>รายได้บ้าน/เดือน</span></div><b>${kf(FAM.inc)}</b></div>`;$('rn').disabled=false;$('rn').textContent='ยอมรับชีวิตนี้ · เลือกโรงเรียน ▶';$('rr').disabled=false;beep(880,.12,'triangle')}},100)}
function askRebirth(){ov(`<h2>อยากเกิดใหม่จริงเหรอ?</h2><p>ชีวิตนี้จะหายไป (${TR[FAM.tier][1]} · เงินติดตัว ${fm(FAM.cash)}) และสุ่มใหม่ได้ไม่ย้อนกลับ ผลใหม่อาจดีหรือแย่กว่าเดิมก็ได้</p><button class="btn g" onclick="cov();RB++;rollPage()">เกิดใหม่เลย</button><button class=btn onclick=cov()>ใช้ชีวิตนี้ต่อ</button>`)}
function startG(){if(SEL==null)return;const t=SEL,ln=t>FAM.tier,md=MODE,fb=Math.min(FAM.tier,1,t-1);
ov(`<h2>ยืนยันการเข้าเรียน</h2><p><b>${TR[t][0]}</b><br>${ln?'กู้เงินเรียน '+fm(TR[t][5])+' (ดอกเบี้ย 5%/ปี)':'ครอบครัวจ่ายค่าเทอม '+fm(TR[t][5])}<br>${md=='bribe'?'ยัดแป๊ะเจี๊ยะ '+fm(BR[t])+' ติดแน่นอน (ไม่ได้ส่วนลดหรือทุน)':'สอบเข้า '+(t?'ติดราว '+(100-CUT[t])+'% ถ้าไม่ติดไปเรียน'+TR[fb][0]+'แทน':'ทุกคนผ่านเกณฑ์')+'<br>คะแนน 80+ ลดค่าเทอม 20% · 90+ ได้ทุนเต็มจำนวน'}</p><button class="btn g" onclick="cov();goG()">ยืนยัน</button><button class=btn onclick=cov()>กลับไปเลือกใหม่</button>`)}
function goG(){const t=SEL,ln=t>FAM.tier;if(load()&&!confirm('มีเซฟอยู่แล้ว เริ่มใหม่จะเขียนทับ ต้องการเริ่มใหม่ไหม?'))return;ADM={mode:t>=2?MODE:'exam',loan:ln};PF=Object.assign({},FAM,{tier:SEL,fam:FAM.tier});begin()}
function cont(){const s=load();if(!s){alert('เซฟเสียหายหรือไม่มี');return menu()}S=Object.assign(init(),s);if(!('v2' in s))S.f.met=1;if(!s.y0)S.y0=snap();S.yr=S.yr||[];S.yn=S.yn||[];S.day>1?plan():play(pickSc())}
/* ---- สรุปรายปี ---- */
const snap=()=>({money:S.money,trust:S.trust,mood:S.mood,skill:S.skill,look:S.look,debt:S.debt||0});
const kf=n=>{const a=Math.abs(n);return a>=1e6?+(a/1e6).toFixed(1)+' ล้าน':a>=1e3?+(a/1e3).toFixed(a>=1e5?0:1)+'k':Math.round(a)+''};
const sg=n=>(n>=0?'+':'')+Math.round(n);
function closeYear(a0){let pay=0,intr=0;const db=S.debt||0;if(db>0){pay=Math.min(Math.max(0,S.money),Math.round(db*.2));S.money-=pay;S.debt=db-pay;intr=Math.round(S.debt*.05);S.debt+=intr;if(S.debt>=50000)S.mood=cl(S.mood-3)}const y=S.y0||snap(),d=Math.round(S.money-y.money),Y={a0,a1:age(),d,mn:S.money,mood:S.mood,dt:S.trust-y.trust,dk:S.skill-y.skill,dl:S.look-y.look,news:(S.yn||[]).slice(-2),pay,intr,debt:S.debt||0};S.yr=S.yr||[];S.yr.push({a:a0,d});S.yn=[];S.y0=snap();return Y}
function yearSum(Y){const H=S.yr,mx=Math.max(1,...H.map(x=>Math.abs(x.d)));
const bars=H.map((x,i)=>{const h=x.d?Math.max(3,Math.round(Math.abs(x.d)/mx*92)):0;return`<div class="yb${i<H.length-1?' old':''}" title="อายุ ${x.a}: ${x.d<0?'-':'+'}${kf(x.d)}">${h?`<i class="${x.d>=0?'p':'n'}" style="height:${h}px"></i>`:''}</div>`}).join('');
const ax=H.map(x=>`<span>${x.a}</span>`).join('');
const mood=Y.mood>=70?'ตอนนี้อีฟอารมณ์ดี อยู่ใกล้กันแล้วสบายใจ':Y.mood>=45?'อารมณ์อีฟค่อนข้างนิ่ง ปีนี้ไม่มีอะไรหวือหวา':Y.mood>=25?'อีฟดูเหนื่อยล้าลงเรื่อย ๆ อย่าลืมใส่ใจเธอบ้าง':'อีฟอารมณ์ย่ำแย่ ความสัมพันธ์เริ่มสั่นคลอน';
const gov=S.vote?(S.vote=='ไม่ไปเลือกตั้ง'?'ครั้งล่าสุดคุณไม่ได้ไปเลือกตั้ง':'ครั้งล่าสุดคุณลงคะแนนให้'+S.vote):'ยังไม่มีการเลือกตั้งทั่วไป';
const d=Y.d,dc=d>0?'up':d<0?'dn':'',dt=d>0?'▲ '+kf(d):d<0?'▼ '+kf(d):'– 0';
A.innerHTML=`<div class=ys><div class=kk><b>กระโดดเวลา</b>${Y.a0<=17?'วัยเรียน · ม.'+(Y.a0-11):'วัยทำงาน'}</div><h2>ผ่านไป 1 ปี · อายุ ${Y.a0} → ${Y.a1}</h2>
<div class=ysc role=img aria-label="กราฟเงินที่เก็บได้ต่อปี ปีนี้ ${d<0?'ติดลบ ':''}${kf(d)}">${bars}</div><div class=yax>${ax}</div>
<div class=ylg><span><i style="background:#34d399;border-radius:4px"></i>เงินที่เก็บได้ต่อปี</span><span><i style="background:#fb7185;border-radius:4px"></i>ติดลบ</span></div>
<div class=y3><div class=yk><div class=yh>${ico('clock',26)}<span>ช่วงนี้</span></div><b class="${dc}">${dt}</b></div><div class=yk><div class=yh>${ico('coin',26)}<span>เงินเก็บ</span></div><b>${fm(Y.mn)}</b></div><div class=yk><div class=yh>${ico('house',26)}<span>รายได้บ้าน/เดือน</span></div><b>${kf(S.inc||0)}</b></div></div>
<div class=ym>${ico('smile',22)}<span>${mood}</span></div><div class=yd>ไว้ใจ ${sg(Y.dt)} · ความรู้ ${sg(Y.dk)} · ความสวย ${sg(Y.dl)}</div>
<div class=yg>${ico('pin',16)}<span>บ้านเมืองตอนนี้: ${gov}</span></div>${Y.news.length?`<div class=yg style="margin-left:26px">เหตุการณ์ปีนี้: ${Y.news.join(' · ')}</div>`:''}
${Y.debt||Y.pay?`<div class=yg>${ico('coin',16)}<span>หนี้กู้เรียนเหลือ ${fm(Y.debt)} (ผ่อนปีนี้ ${fm(Y.pay)} · ดอกเบี้ย +${fm(Y.intr)})</span></div>`:''}<button class=yn onclick=yGate()>ต่อไป</button></div>`;window.scrollTo(0,0);save();beep(660,.12,'triangle')}
menu();
</script></body></html>
