S.trust=cl(S.trust+t);S.mood=cl(S.mood+m);if(t<=-5)S.f.bad=(S.f.bad||0)+1;(f||'').split(',').filter(Boolean).forEach(x=>S.f[x]=(S.f[x]||0)+1);
if(S.f.rival){if(S.rv<15)S.rv=15;S.rv=cl(S.rv+(t<0?-t:-(t>>1)))}if((c[6]||'')[0]=='M')S.money-=+c[6].slice(1);$('cho').innerHTML='';hudU();const ch=`ไว้ใจ ${t>=0?'+':''}${t} · อารมณ์อีฟ ${m>=0?'+':''}${m}${t<=-5?' · ⚠ คำตอบนี้ทำให้อีฟผิดหวัง':''}`;
Q.splice(qi,0,...r.split('/').map(pl),{w:'N',t:ch});save();node()}
function endScene(){if(cur.end)return ending(cur.end);S.hist.push(cur.id);S.mh.push(S.mood);save();const tr=S.trust-S.t0,mo=S.mood-S.m0;
ov(`<h2>สรุปวันที่ ${S.day}</h2>ความไว้ใจ ${S.trust} (${tr>=0?'+':''}${tr})<br>อารมณ์อีฟ ${S.mood} (${mo>=0?'+':''}${mo})<br><button class="btn g" style="margin-top:12px" onclick="cov();nextDay()">วันถัดไป ▶</button>`)}
function endCheck(){const d=S.day,t=S.trust,f=S.f,am=S.mh.reduce((a,b)=>a+b,0)/S.mh.length;
if(f.solo)return'solo';if(f.rival&&S.rv>=90)return t>=75?'chosen':'left';if(t<=10||(f.bad||0)>=4||(d>=8&&t<=20&&(f.ignored||0)>=2))return'heart';if(f.msg&&f.letter&&t>=70&&d>=14)return'secret';
if(f.offer&&d>=16&&t>=35)return f.support&&t>=70&&am>=55?'best':'odd';
if(d>=20&&t>=85&&(f.listened||0)>=3&&am>=55&&(!f.rival||S.rv<70))return'best';if(d>=20&&t>=65&&(!f.rival||S.rv<70))return'good';if(d>=28)return t>=35?'neutral':'heart';return null}
function pickSc(){if(S.day==1)return SC[0];const last=S.hist.slice(-4),ok=e=>(!e.d0||S.day>=e.d0)&&(!e.f||S.f[e.f])&&(!e.nf||!S.f[e.nf])&&(!e.rvmin||S.rv>=e.rvmin)&&(!e.lk||S.look>=e.lk)&&(!e.sk||S.skill>=e.sk)&&(!e.own||(e.own=='*'?Object.keys(S.own).length:S.own[e.own]))&&!(e.once&&S.hist.includes(e.id))&&!e.fix;let p=SC.filter(e=>ok(e)&&!last.includes(e.id));const sp=p.filter(e=>e.sp);if(sp.length&&Math.random()<.4)return rnd(sp);p=p.filter(e=>!e.sp);if(!p.length)p=SC.filter(e=>ok(e)&&!e.sp);return rnd(p)}
function nextDay(){const k=endCheck();if(k=='heart')return play(BRK);if(k=='left')return play(BRK2);if(k)return ending(k);S.day++;if(S.f.rival)S.rv=cl(S.rv+3);S.news='';if(Math.random()<.55){const e=rnd(RAND);e[1]();S.news=e[0]}S.mood=cl(S.mood+(S.mood>60?-3:3));S.t0=S.trust;S.m0=S.mood;save();plan()}
function ending(k){const E=END[k];music(['heart','left'].includes(k)?[220,196,175,165]:SCE);try{localStorage.removeItem(K)}catch(e){}
stage(E[2],['heart','left'].includes(k)?'upset':'happy',['heart','left'].includes(k)?'upset':'happy');$('nm').style.display='none';$('tx').textContent=E[0];
ov(`<h2>${E[0]}</h2>${E[1]}<p>ผ่านมา <b>${S.day}</b> วัน · ไว้ใจ ${S.trust} · อารมณ์อีฟ ${S.mood}<br>เหตุการณ์ที่ผ่าน ${S.hist.length} เรื่อง<br>เงิน ฿${S.money} · ความสวย ${S.look}/10 · ทักษะ ${S.skill}/10<br>ทรัพย์สิน: ${Object.keys(S.own).map(k=>AS[k][2]+AS[k][0]).join(' ')||'ไม่มี'}</p><button class="btn g" onclick="cov();S=init();save();music();play(SC[0])">เล่นอีกครั้ง</button><button class=btn onclick="cov();menu()">กลับเมนูหลัก</button>`)}
function hist(){ov(`<h2>บันทึกสนทนา</h2>${S.dl.map(x=>`<div>${x}</div>`).join('')||'ยังไม่มีบทสนทนา'}<button class=btn style="margin-top:10px" onclick=cov()>ปิด</button>`)}
function pause(){ov(`<h2>เมนู</h2>เพลง <input type=range min=0 max=100 value=${ST.mv} oninput="ST.mv=+this.value;setSave()">เสียงเอฟเฟกต์ <input type=range min=0 max=100 value=${ST.sv} oninput="ST.sv=+this.value;setSave();beep(600)">ความเร็วข้อความ (ช้า→เร็ว) <input type=range min=5 max=60 value=${65-ST.ts} oninput="ST.ts=65-this.value;setSave()"><button class=btn onclick="save();cov()">💾 บันทึกและเล่นต่อ</button><button class=btn onclick="save();cov();menu()">กลับเมนูหลัก</button><button class=btn onclick="if(confirm('ลบความคืบหน้าทั้งหมด?')){localStorage.removeItem(K);cov();S=init();menu()}">🗑 รีเซ็ตความคืบหน้า</button>`)}
const AS={phone:['โทรศัพท์รุ่นใหม่',2500,'📱','เปิดตัวเลือกใหม่ในบางฉาก'],bike:['จักรยาน',3500,'🚲','ปั่นไปรับ-ส่งอีฟได้'],car:['รถยนต์มือสอง',12000,'🚗','ขับไปส่งอีฟตอนฝนตก'],condo:['คอนโดเล็ก (ดาวน์)',25000,'🏢','เชิญมาทานข้าวที่ห้อง']};
const up=(k,v)=>{S[k]=Math.min(10,S[k]+v)};
const ACT=[['ทำงานประจำ','ได้ ฿300 (มีโอกาสได้โบนัส)',0,0,()=>{const r=300+(Math.random()<.2?100:0);S.money+=r;return'ได้ ฿'+r}],['ฟรีแลนซ์','ต้องมีทักษะ 3 · ได้ ฿800',0,3,()=>{S.money+=800;return'ได้ ฿800'}],['เรียนคอร์สพัฒนาทักษะ','฿300 · ทักษะ +2',300,0,()=>{up('skill',2);return'ทักษะ +2'}],['ดูแลผิวและทำผม','฿400 · ความสวย +2',400,0,()=>{up('look',2);return'ความสวย +2'}],['ซื้อเสื้อผ้าใหม่','฿800 · ความสวย +3',800,0,()=>{up('look',3);return'ความสวย +3'}],['แอบส่องโซเชียลอีฟ','รู้ว่าคู่แข่งใกล้ชิดแค่ไหน แต่ไว้ใจลด 2',0,0,()=>{S.trust=cl(S.trust-2);return S.f.rival?`คู่แข่งใกล้ชิดอีฟ ${S.rv}%`:'ยังไม่มีใครน่าสงสัย'}],['ออกกำลังกาย','ฟรี · ความสวย +1',0,0,()=>{up('look',1);return'ความสวย +1'}]];
function plan(){S.slots=2-(S.slotsPen||0);S.slotsPen=0;planUI()}
function planUI(){A.innerHTML=`<div class=two><div class=stage style="height:36dvh;min-height:240px"><canvas class=bg id=bg></canvas><canvas class=ch id=cw style="left:50%;transform:translateX(-50%);height:100%;bottom:0"></canvas></div><div><h2>วันที่ ${S.day} · วางแผนก่อนไปพบอีฟ</h2><div class=card>฿${S.money} · ความสวย ${S.look}/10 · ทักษะ ${S.skill}/10<br>ไว้ใจ ${S.trust} · อารมณ์อีฟ ${S.mood}<br>ทรัพย์สิน: ${Object.keys(S.own).map(k=>AS[k][2]+AS[k][0]).join(' ')||'ยังไม่มี'}<br>ช่วงเวลาที่เหลือ: ${S.slots}</div>${S.news?`<div class=card>📰 ${S.news}</div>`:''}${ACT.map((x,i)=>`<button class=btn ${S.slots<1||S.money<x[2]||S.skill<x[3]?'disabled':''} onclick=doAct(${i})>${x[0]}<small>${x[1]}</small></button>`).join('')}<button class=btn onclick=assets()>🏬 ร้านทรัพย์สิน (ไม่ใช้ช่วงเวลา)</button><button class=btn onclick="if(confirm('เลือกโสดและจบเกมตอนนี้?')){S.f.solo=1;ending('solo')}">🕊 เลือกโสด จบเกม</button><button class="btn g" onclick="play(pickSc())">ไปพบอีฟ ▶</button><button class=btn onclick=pause()>☰ เมนู</button></div></div>`;bgArt($('bg'),'room');bust($('cw'),'W','happy',lvl())}
function doAct(i){const x=ACT[i];if(S.slots<1||S.money<x[2]||S.skill<x[3])return;S.money-=x[2];S.slots--;toast(x[4]());beep(880,.12,'triangle');save();planUI()}
function assets(){ov(`<h2>ร้านทรัพย์สิน</h2><small>฿${S.money} · ทรัพย์สินเปิดทางเลือกใหม่ แต่ซื้อใจใครไม่ได้</small>${Object.entries(AS).map(([k,v])=>`<div class=card>${v[2]} <b>${v[0]}</b> ฿${v[1]}<small>${v[3]}</small><button class=btn ${S.own[k]||S.money<v[1]?'disabled':''} onclick="buyA('${k}')">${S.own[k]?'มีแล้ว':'ซื้อ'}</button></div>`).join('')}<button class=btn onclick=cov()>ปิด</button>`)}
function buyA(k){S.money-=AS[k][1];S.own[k]=1;beep(990,.15,'triangle');save();cov();planUI();assets()}
function menu(){S=S||init();const has=!!load();A.innerHTML=`<h1>HOW MANY<br>DAYS?</h1><div class=stage style="height:58dvh;min-height:360px"><canvas class=bg id=bg></canvas><canvas class=ch id=cw style="left:-4%;height:55%;bottom:0"></canvas><canvas class=ch id=ce style="right:-4%;height:55%;bottom:0"></canvas></div><p style="text-align:center">วาวาจะพยายามไปได้อีกกี่วัน?</p><button class=btn onclick=newG()>เริ่มเกมใหม่</button><button class=btn ${has?'':'disabled'} onclick=cont()>เล่นต่อ</button><button class=btn onclick=pause()>ตั้งค่า</button><button class=btn onclick="ov('<h2>เครดิต</h2>ภาพและเสียงทั้งหมดสร้างด้วย canvas และ WebAudio ไม่ใช้ไฟล์ภายนอก<br>เกมนี้เล่าว่า ความใส่ใจต้องเคารพความรู้สึกและขอบเขตของอีกฝ่ายเสมอ<button class=btn onclick=cov()>ปิด</button>')">เครดิต</button>`;bgArt($('bg'),'night');bust($('cw'),'W','happy');bust($('ce'),'E','happy')}
function newG(){if(load()&&!confirm('มีเซฟอยู่แล้ว เริ่มใหม่จะเขียนทับ ต้องการเริ่มใหม่ไหม?'))return;S=init();save();music();play(SC[0])}
function cont(){const s=load();if(!s){alert('เซฟเสียหายหรือไม่มี');return menu()}S=Object.assign(init(),s);S.day>1?plan():play(pickSc())}
menu();
</script></body></html>
